[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "genplanner"
version = "1.0.3"
description = "GenPlanner python+rust library"
readme = "README.rst"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "DDonnyy", email = "63115678+DDonnyy@users.noreply.github.com" }
]
dependencies = [
    "tqdm>=4.66.2,<5.0.0",
    "numpy>=2.1.3,<3.0.0",
    "pandas>=2.2.0,<3.0.0",
    "geopandas>=1.0.0,<2.0.0",
    "loguru>=0.7.2,<1.0.0",
    "scipy>=1.13.1,<2.0.0",
    "pulp>=3.1.1,<4.0.0",
]

[dependency-groups]
dev = [
    { include-group = "docs" },
    { include-group = "lint" },
    { include-group = "release" },
    { include-group = "test" },
    "pre-commit>=4.2.0,<5.0.0",
]
docs = [
    "sphinx>=8.0.0,<9.0.0",
    "furo>=2025.9.25,<2026.0.0",
    "myst-nb>=1.1.0,<2.0.0",
    "sphinx-autodoc-typehints>=3.2.0,<4.0.0",
    "sphinx-copybutton>=0.5.2,<0.6.0",
    "sphinx-design>=0.6.0,<0.7.0",
]
lint = [
    "black>=25.1.0,<26.0.0",
    "pylint>=3.3.0,<4.0.0",
    "isort>=6.0.0,<7.0.0",
]
release = ["python-semantic-release>=9.15.0,<10.0.0"]
test = ["pytest>=8.3.0,<9.0.0", "pytest-cov>=6.0.0,<7.0.0"]
notebooks = [
    "jupyter>=1.0.0,<2.0.0",
    "contextily>=1.6.2,<2.0.0",
    "folium>=0.19.5,<0.20.0",
    "matplotlib>=3.10.1,<4.0.0",
    "mapclassify>=2.8.1,<3.0.0",
    "imageio>=2.37.2,<3.0.0",
]

[tool.maturin]
bindings = "pyo3"
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "genplanner._rust"


[tool.black]
line-length = 120
target-version = ['py311']

[tool.pylint.format]
max-line-length = 120
max-locals = 20
disable = [
    "duplicate-code",
    "missing-module-docstring",
    "missing-function-docstring",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "too-many-arguments",
    "cyclic-import",
    "line-too-long"
]

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
split_on_trailing_comma = true
skip = ["__init__.py"]

[tool.coverage.run]
branch = true
source = ["genplanner"]
relative_files = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.semantic_release]
version_variables = ["pyproject.toml:version", "rust/Cargo.toml:version", "CITATION.cff:version"]
assets = ["uv.lock"]
tag_format = "v{version}"
commit_message = "chore(release): v{version} [skip ci]\n\nAutomated release, see CHANGELOG.md."
build_command = "python -m pip install uv 'maturin>=1.7,<2.0' && uv lock && maturin sdist --out dist"
allow_zero_version = false
major_on_zero = true

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "build", "chore", "ci", "docs", "refactor", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
mode = "update"
exclude_commit_patterns = ['''^chore\(release\):.*''']

